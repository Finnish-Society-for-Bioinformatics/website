    abstract: |
      Recent advances in single-cell long-read sequencing have revolutionised
      our understanding of transcriptomic complexity. However, traditional
      analysis pipelines, designed for short-read sequencing, fail to capture
      the full complexity of isoform-level information. In this talk, I will
      introduce our ongoing project – a novel computational framework – that
      addresses these challenges. Using early blood development as a model
      system, we demonstrate the interesting findings and insights to
