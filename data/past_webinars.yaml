webinars:
  - speaker: "Mohieddin Jafari"
    affiliation: "University of Helsinki, Tampere University"
    title: "A systems pharmacology approach for combinatorial therapy"
    video: "https://www.youtube.com/watch?v=zkwRRiFkgiI"
    abstract: |
      Drug combinations hold promise but are often selected empirically, with
      limited mechanistic understanding. We developed Combinatorial Proteome
      Integral Solubility/Stability Alteration analysis (CoPISA), a
      high-throughput proteomics platform that captures protein-level effects
      uniquely induced by drug combinations. Applying CoPISA to rationally
      designed drug pairs, we uncovered an emergent mechanism we term
      “conjunctional targeting,” in which combinations engage exclusive protein
      targets consistent with an AND-gate logic. By revealing a mechanistic
      layer beyond classical synergy, CoPISA provides a systems pharmacology
      framework for the rational design of combinatorial therapies across
      complex diseases.
  - speaker: "Dennis Völkl"
    affiliation: "University of Bergen"
    title: "HIDE: Hierarchical Cell Type Deconvolution"
    video: "https://www.youtube.com/watch?v=DELQE1zIgTc"
    abstract: |
      The video presents HIDE, a method to estimate cell-type proportions from
      bulk transcriptomics while explicitly using a cell-type hierarchy.
      Instead of deconvolving all cell types at once (which can be unstable
      when references are highly correlated), HIDE proceeds top-down: it first
      estimates broad populations, then iteratively refines into subtypes
      within each parent, using “residual” bulks so child proportions remain
      consistent with the parent total. The method also learns gene weights
      (trained using pseudo-bulks from single-cell data) to improve
      deconvolution accuracy at each hierarchy level. The key benefit is more
      robust and interpretable estimates—upper-level proportions stay reliable
      even if fine-grained subtypes are hard to resolve—while still enabling
      subtype resolution when the signal supports it.
  - speaker: "Dewei Hu"
    affiliation: "University of Copenhagen"
    title: "SPACE: STRING proteins as complementary embeddings"
    video: "https://www.youtube.com/watch?v=8gX7q18jC90"
    abstract: |
      Representation learning has revolutionized sequence-based prediction of
      protein function and subcellular localization. Protein networks are an
      important source of information complementary to sequences, but the use
      of protein networks has proven to be challenging in the context of
      machine learning, especially in a cross-species setting. To address this,
      we leveraged the STRING database of protein networks and orthology
      relations for 1,322 eukaryotes to generate network-based cross-species
      protein embeddings. We did this by first creating species-specific
      network embeddings and subsequently aligning them based on orthology
      relations to facilitate direct cross-species comparisons. We show that
      these aligned network embeddings ensure consistency across species
      without sacrificing quality compared to species-specific network
      embeddings. We also show that the aligned network embeddings are
      complementary to sequence embedding techniques, despite the use of
      seqeuence-based orthology relations in the alignment process. Finally, we
      demonstrate the utility and quality of the embeddings by using them for
      two well-established tasks: subcellular localization prediction and
      protein function prediction. Training logistic regression classifiers on
      aligned network embeddings and sequence embeddings improved the accuracy
      over using sequence alone, reaching performance numbers close to
      state-of-the-art deep-learning methods. A set of precomputed
      cross-species network embeddings and ProtT5 embeddings for all eukaryotic
      proteins have been included in STRING version 12.0.
  - speaker: "Arber Qoku"
    affiliation: "German Cancer Research Center (DKFZ)"
    title: |
      MOFA-FLEX: A Factor Model Language for Integrating Omics Data with Prior
      Knowledge
    video: "https://www.youtube.com/watch?v=EeSa_U3_wCk"
    abstract: |
      Latent factor models are essential tools for analyzing omics data and are
      often the starting point for single- and multi-omics studies. However,
      adapting these models to complex experimental designs involving spatial,
      temporal, or multimodal data typically requires significant statistical
      expertise and development effort. We introduce MOFA-FLEX, a modular and
      extensible Bayesian factor analysis framework built on probabilistic
      programming. MOFA-FLEX integrates and generalizes components from various
      matrix factorization methods, allowing users to combine flexible priors
      (e.g., structured sparsity, covariate-informed), non-negativity
      constraints, supervision signals, and diverse data likelihoods. It also
      introduces a novel sparsity prior for incorporating biological knowledge,
      such as gene sets or pathway signatures, enabling interpretable latent
      factors linked to biological processes. We demonstrate MOFA-FLEX across
      multiple use cases, including (i) robust recovery of gene sets (gene
      programs) in noisy scRNA-seq data using imperfect priors, (ii)
      disentangling technical and biological variation in multi-omics studies,
      and (iii) modeling spatial omics data to map disease-associated gene
      activity in breast cancer. Ultimately, MOFA-FLEX streamlines the creation
      of tailored and interpretable models for diverse omics applications.
  - speaker: "Alexandru Tomescu"
    affiliation: "University of Helsinki"
    title: |
      Decomposing a weighted graph into few paths for solving multi-assembly
      problems
    video: "https://www.video.com/watch?v=J0n-Xwyr7RM"
    abstract: |
      A multi-assembly problem usually asks to decompose a weighted graph into
      a small number of weighted paths. For example, in the RNA transcript
      assembly problem, the graph nodes are gene exons, the weights are read
      coverages, and the edges indicate connections between exons observed in
      the RNA-seq reads. The weighted paths are then the RNA transcripts
      (together with their expression levels), that need to be identified from
      the RNA-seq reads. Such problems easily become NP-hard, and thus many RNA
      assembly tools solve them heuristically. In this talk I will give an
      overview of our recent results on extremely fast and exact solvers for a
      range of such decomposition problems. These are based on Mixed Integer
      Linear Programming, and benefit from additional “safety optimizations”
      based on insight into the “simple” parts of the graph structure. These
      results are currently being incorporated into a Python package, so that
      developers of future multi-assembly tools can easily use exact and
      accurate decomposition methods.
  - speaker: "Dr. Jing Tang"
    affiliation: "University of Helsinki"
    title: |
      Advanced computational and experimental methods to tackle drug resistance
      in cancer
    video: "https://www.youtube.com/watch?v=zIR9G-E-0WU"
    abstract: |
      Despite scientific advances, options for treating cancer patients are
      still limited, especially after relapse. To achieve more sustainable
      treatment efficacy, patients will need novel drug targets and combination
      therapies. However, the lack of understanding on cancer-drug interactions
      prevents biomarker discovery and ultimately leads to high attrition in
      clinical trials. In this talk, I will introduce multiple systems medicine
      approaches for the prediction of drug targets, the prediction of drug
      sensitivity, and the prediction of drug combinations. I will explore: 1)
      whether the loss-of-function genetic screen technologies such as CRISPR
      or RNAi can help identify cancer dependency map; 2) whether the
      integration of loss-of-function genetic and drug sensitivity screening
      data could help identify the mechanisms of action of drugs; and 3)
      whether the drug target interaction and drug sensitivity data can help
      predict synergistic drug combinations. Finally, I will show the potential
      of lineage tracing data to inform an evidence-based treatment decision.
  - speaker: "Chengbo Fu"
    affiliation: "Aalto University"
    title: |
      KMAP: Kmer Manifold Approximation and Projection for visualizing DNA
      sequences
    video: "https://www.video.com/watch?v=gRVHLu7MoI0"
    abstract: |
      Identifying and illustrating patterns in DNA sequences is a crucial task
      in various biological data analyses. In this task, patterns are often
      represented by sets of kmers, the fundamental building blocks of DNA
      sequences. To visually unveil these patterns, we could project each kmer
      onto a point in two-dimensional (2D) space. However, this projection
      poses challenges due to the high-dimensional nature of kmers and their
      unique mathematical properties. Here, we established a mathematical
      system to address the peculiarities of the kmer manifold. Leveraging this
      kmer manifold theory, we developed a statistical method named KMAP for
      detecting kmer patterns and visualizing them in 2D space. We applied KMAP
      to three distinct datasets to showcase its utility. KMAP achieved a
      comparable performance to the classical method MEME, with approximately
      90% similarity in motif discovery from HT-SELEX data. In the analysis of
      H3K27ac ChIP-seq data from Ewing Sarcoma (EWS), we found that BACH1, OTX2
      and ERG1 might affect EWS prognosis by binding to promoter and enhancer
      regions across the genome. We also found that FLI1 bound to the enhancer
      regions after ETV6 degradation, which showed the competitive binding
      between ETV6 and FLI1. Moreover, KMAP identified four prevalent patterns
      in gene editing data of the AAVS1 locus, aligning with findings reported
      in the literature. These applications underscore that KMAP could be a
      valuable tool across various biological contexts.
