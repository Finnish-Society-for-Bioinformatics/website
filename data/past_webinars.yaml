  - speaker: "Luca Musella"
    affiliation: "University Hospital of Erlangen at Julio Vera’s lab, Germany"
    title: |
      ENQUIRE reconstructs and expands context-specific co-occurrence
      networks from biomedical literature
    image: ../images/webinar.jpg
    abstract: |
      The accelerating growth of scientific literature overwhelms our capacity
      to manually distill complex phenomena like molecular networks linked to
      diseases. Moreover, biases in biomedical research and database annotation
      limit our interpretation of facts and generation of hypotheses. ENQUIRE
      (Expanding Networks by Querying Unexpectedly Inter-Related Entities)
      offers a time- and resource-efficient alternative to manual literature
      curation and database mining. ENQUIRE reconstructs and expands
      co-occurrence networks of genes and biomedical ontologies from
      user-selected input corpora and network-inferred PubMed queries. The
      integration of text mining, automatic querying, and network-based
      statistics mitigating literature biases makes ENQUIRE unique in its
      broad-scope applications. For example, ENQUIRE can generate co-occurrence
      gene networks that reflect high-confidence, functional networks. When
      tested on case studies spanning cancer, cell differentiation, and
      immunity, ENQUIRE identified interlinked genes and enriched pathways
      unique to each topic, thereby preserving their underlying diversity.
