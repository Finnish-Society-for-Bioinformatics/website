name: "Bioconductor map: modify my entry"
description: Update your details on the map of the Finnish Bioconductor community.
title: "[Bioconductor map] Modify: "
labels: ["bioc-map", "bioc-map: modify"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in only the fields you want to change. Requests from the GitHub user linked to the entry are the easiest to verify.
        All information you give here is **public**.
  - type: input
    id: entry
    attributes:
      label: Current entry
      description: The name or GitHub handle of the entry as it currently appears on the map.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: Your name as it should appear on the map. Leave empty to keep the current value.
    validations:
      required: false
  - type: dropdown
    id: role
    attributes:
      label: Role
      description: Developers maintain or contribute to a Bioconductor package. Leave empty to keep the current value.
      options:
        - Bioconductor user
        - Bioconductor developer
    validations:
      required: false
  - type: input
    id: city
    attributes:
      label: City
      description: City where you are based. Only the city is shown, not an exact location. The map location is looked up automatically. Leave empty to keep the current value.
      placeholder: Turku
    validations:
      required: false
  - type: input
    id: country
    attributes:
      label: Country
      description: Country where you are based. You are welcome on the map also if you have moved abroad. Leave empty to keep the current value.
      placeholder: Finland
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: Job title
      description: Optional. Your current position. Leave empty to keep the current value, or write `-` to remove it.
      placeholder: Doctoral researcher
  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      description: Optional. University, institute, or company. Leave empty to keep the current value, or write `-` to remove it.
      placeholder: University of Turku
  - type: input
    id: github
    attributes:
      label: GitHub handle
      description: Optional. Your GitHub username or a link to your profile. Your GitHub profile picture is shown on the map card. Leave empty to keep the current value, or write `-` to remove it.
      placeholder: octocat
  - type: input
    id: linkedin
    attributes:
      label: LinkedIn
      description: Optional. Your LinkedIn profile name (the part after linkedin.com/in/) or a link to your profile. Leave empty to keep the current value, or write `-` to remove it.
      placeholder: your-name
  - type: input
    id: bluesky
    attributes:
      label: Bluesky
      description: Optional. Your Bluesky handle or a link to your profile. Leave empty to keep the current value, or write `-` to remove it.
      placeholder: name.bsky.social
  - type: input
    id: website
    attributes:
      label: Website
      description: Optional. Personal or group website. Leave empty to keep the current value, or write `-` to remove it.
      placeholder: https://example.com
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I agree that the information above is published on the Finnish Society for Bioinformatics website and in this public GitHub repository.
          required: true
