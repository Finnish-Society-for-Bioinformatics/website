# Creates the labels used by the issue templates and the Bioconductor map and
# job advertisement workflows. Issue templates can only add labels that already
# exist, so this runs whenever this file changes on main. It can also be run
# manually from the Actions tab.

name: Labels

on:
  workflow_dispatch:
  push:
    branches: main
    paths: .github/workflows/labels.yml

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create labels
        run: |
          while IFS='|' read -r name color description; do
            gh label create "$name" --color "$color" --description "$description" --force
          done <<'LABELS'
          approved|0e8a16|Approved by a maintainer; opens a pull request
          bioc-map|3792ad|Bioconductor map request
          bioc-map: add|3792ad|Add a person to the Bioconductor map
          bioc-map: modify|3792ad|Modify a person on the Bioconductor map
          bioc-map: remove|3792ad|Remove a person from the Bioconductor map
          bioc-map: valid|c2e0c6|Bioconductor map request passed the checks
          bioc-map: needs changes|f9d0c4|Bioconductor map request needs changes
          job-ad|8a63d2|Job advertisement
          job-ad: remove|8a63d2|Remove a job advertisement
          job-ad: valid|c2e0c6|Job advertisement passed the checks
          job-ad: needs changes|f9d0c4|Job advertisement needs changes
          LABELS
