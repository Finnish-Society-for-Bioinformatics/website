on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Ensure full git history is available (needed for Quarto publishing)
          ref: main # Explicitly check out the 'main' branch
          lfs: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Ensure that the caching directory is available
      - name: Ensure R library directory exists
        run: mkdir -p "$R_LIBS_USER"

      # Cache previously installed R packages to speed up future builds
      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-

      # Install all R dependencies defined in DESCRIPTION file
      - name: Install dependencies
        run: |
          Rscript -e "install.packages('remotes')"
          Rscript -e "install.packages('devtools')"
          Rscript -e "Sys.setenv(GITHUB_PAT = Sys.getenv('GITHUB_TOKEN')); devtools::install_deps(dependencies = TRUE)"

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
